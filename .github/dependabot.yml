# Weekly updates: Terraform providers, pinned images and the CI actions.
version: 2
updates:
  - package-ecosystem: terraform
    directories: ["/terraform/envs/local", "/terraform/envs/aws", "/terraform/envs/aws-bootstrap"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /verify
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
